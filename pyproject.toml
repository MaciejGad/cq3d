[project]
name = "cadquery-3d-dsl"
version = "0.1.0"
description = "Text-based DSL for generating 3D printable models with CadQuery"
requires-python = ">=3.11"
dependencies = [
    "cadquery",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]",
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
cq3d = "cq3d.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cq3d"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
